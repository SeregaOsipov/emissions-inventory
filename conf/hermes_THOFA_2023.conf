### YEARLY EDGARv8.1 Emissions: AP, spectiated VOC, CH4
# voc16, voc20 removed from Speciation in sector WASTE, EDGARv81_VOC
# voc11 is removed from sector fuel_exploitation, EDGARv81_VOC for year 2022 only. Add it back otherwise

[GENERAL]
log_level = 3
# input_dir = /project/k10048/osipovs/Data/emissions/hermes/HERMES_IN
# input_dir = /project/k10048/osipovs/workspace/hermesv3_gr
input_dir = /HDD1/Data/emissions/hermes/HERMES_IN
data_path = /HDD1/Data/emissions/hermes/datasets
# output_dir = /project/k10048/osipovs/Data/emissions/hermes/HERMES_OUT
output_dir = /HDD1/Data/emissions/hermes/HERMES_OUT

output_name = HERMESv3_radm2_madesorgam_<date>_THOFA.nc
start_date =  2023/05/15 00:00:00
# ***** end_date = start_date [DEFAULT] *****
#end_date = 2023/01/01 00:00:00
# ***** output_timestep_type = [hourly, daily, monthly, yearly] *****
output_timestep_type = daily
output_timestep_num = 46  # 1 year  # 100
output_timestep_freq = 1
first_time = 0
erase_auxiliary_files = 0
# Compression level from 0 to 9; 0 corresponds to no compression and 9 to maximum compression
compression_level = 4

[DOMAIN]

# ***** output_model = [MONARCH, CMAQ, WRF_CHEM] *****
output_model = WRF_CHEM
output_attributes = <input_dir>/data/global_attributes.csv

# domain_type=[lcc, rotated, mercator, regular, rotated_nested]
domain_type = lcc
vertical_description = <input_dir>/data/profiles/vertical/Surface_1layers_vertical_description.csv  # Benchmark_15layers_vertical_description.csv
auxiliary_files_path = /HDD1/Data/emissions/hermes/HERMES_OUT/auxiliary_files/WRF_CHEM_<domain_type>_<resolution>_450_450

# if domain_type == lcc:
    lat_1 = 27.962
    lat_2 = 27.962
    lon_0 = 42.022
    lat_0 = 27.962
    nx = 450
    ny = 450
    inc_x = 10000
    inc_y = 10000
    x_0 = -2250000
    y_0 = -2250000

[EMISSION_INVENTORY_CONFIGURATION]

cross_table = <input_dir>/conf/EI_configuration_THOFA_WRF_Chem_2023.csv

[EMISSION_INVENTORY_PROFILES]

p_vertical = <input_dir>/data/profiles/vertical/Vertical_profile.csv
p_month = <input_dir>/data/profiles/temporal/TemporalProfile_Monthly.csv
#p_week = <input_dir>/data/profiles/temporal/TemporalProfile_Weekly.csv
p_week = <input_dir>/data/profiles/temporal/TemporalProfile_Weekly_islamic.csv  # Observe that weekends in the Middle East are Friday and Saturday
p_day = <input_dir>/data/profiles/temporal/TemporalProfile_Daily.csv
p_hour = <input_dir>/data/profiles/temporal/TemporalProfile_Hourly.csv
p_speciation = <input_dir>/data/profiles/speciation/Speciation_profile_radm2_madesorgam_WRF_CHEM_AQABA.csv

molecular_weights = <input_dir>/data/profiles/speciation/MolecularWeights.csv
world_info = <input_dir>/data/profiles/temporal/tz_world_country_iso3166.csv
countries_shapefile = <input_dir>/data/gadm_country_mask/gadm_country_ISO3166.shp
